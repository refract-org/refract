<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580">
  <title>ObservationReport structure</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .box-title { font-size: 12px; font-weight: 700; }
    .box-desc { font-size: 10px; fill: #4b5563; }
    .sig { font-size: 9px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <rect width="720" height="580" fill="#fafbfc" rx="8"/>

  <text x="360" y="36" text-anchor="middle" class="title">ObservationReport Structure</text>
  <text x="360" y="56" text-anchor="middle" class="subtitle">Events grouped by claim into a ClaimLedger, with Merkle root for integrity</text>

  <!-- Input: Raw Events -->
  <rect x="40" y="85" width="640" height="80" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="85" width="640" height="24" rx="8" fill="#e5e7eb"/>
  <text x="360" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Raw EvidenceEvent Stream (26 event types, NDJSON)</text>
  <rect x="60" y="120" width="130" height="30" rx="4" fill="#dbeafe"/>
  <text x="125" y="139" text-anchor="middle" class="sig" fill="#1e40af">sentence_first_seen</text>
  <rect x="200" y="120" width="130" height="30" rx="4" fill="#dbeafe"/>
  <text x="265" y="139" text-anchor="middle" class="sig" fill="#1e40af">citation_added</text>
  <rect x="340" y="120" width="130" height="30" rx="4" fill="#fff3cd"/>
  <text x="405" y="139" text-anchor="middle" class="sig" fill="#92400e">sentence_modified</text>
  <rect x="480" y="120" width="130" height="30" rx="4" fill="#f8d7da"/>
  <text x="545" y="139" text-anchor="middle" class="sig" fill="#991b1b">revert_detected</text>
  <text x="360" y="158" text-anchor="middle" class="sig" fill="#6b7280">...</text>

  <!-- Arrow -->
  <line x1="360" y1="165" x2="360" y2="195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="184" class="sig" fill="#6b7280">--report flag triggers grouping</text>

  <!-- ClaimLedger -->
  <rect x="40" y="205" width="640" height="160" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="205" width="640" height="24" rx="8" fill="#d1fae5"/>
  <text x="360" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ClaimLedger — grouped by claimId</text>

  <!-- Claim 1 -->
  <rect x="60" y="240" width="290" height="110" rx="6" fill="#fff" stroke="#a7f3d0" stroke-width="1"/>
  <text x="205" y="258" text-anchor="middle" class="box-title" fill="#047857">Claim A: "Bitcoin is a digital currency"</text>
  <rect x="75" y="268" width="260" height="18" rx="3" fill="#f0fdf4"/>
  <text x="205" y="281" text-anchor="middle" class="sig" fill="#065f46">→ sentence_first_seen (rev 100)</text>
  <rect x="75" y="290" width="260" height="18" rx="3" fill="#fef3c7"/>
  <text x="205" y="303" text-anchor="middle" class="sig" fill="#92400e">→ sentence_modified (rev 110)</text>
  <rect x="75" y="312" width="260" height="18" rx="3" fill="#f0fdf4"/>
  <text x="205" y="325" text-anchor="middle" class="sig" fill="#065f46">→ state: STABLE (present at end)</text>

  <!-- Claim 2 -->
  <rect x="370" y="240" width="290" height="110" rx="6" fill="#fff" stroke="#fca5a5" stroke-width="1"/>
  <text x="515" y="258" text-anchor="middle" class="box-title" fill="#991b1b">Claim B: "Bitcoin is anonymous"</text>
  <rect x="385" y="268" width="260" height="18" rx="3" fill="#fef2f2"/>
  <text x="515" y="281" text-anchor="middle" class="sig" fill="#991b1b">→ sentence_first_seen (rev 105)</text>
  <rect x="385" y="290" width="260" height="18" rx="3" fill="#fef2f2"/>
  <text x="515" y="303" text-anchor="middle" class="sig" fill="#991b1b">→ revert_detected (rev 108)</text>
  <rect x="385" y="312" width="260" height="18" rx="3" fill="#fef2f2"/>
  <text x="515" y="325" text-anchor="middle" class="sig" fill="#991b1b">→ state: REMOVED (absent at end)</text>

  <!-- Arrow -->
  <line x1="360" y1="365" x2="360" y2="395" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="384" class="sig" fill="#6b7280">aggregated into</text>

  <!-- ObservationReport -->
  <rect x="40" y="405" width="640" height="155" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="405" width="640" height="24" rx="8" fill="#dbeafe"/>
  <text x="360" y="421" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">ObservationReport</text>

  <text x="360" y="450" text-anchor="middle" class="sig" fill="#374151">{</text>
  <text x="360" y="466" text-anchor="middle" class="sig" fill="#374151">  "pageTitle": "Bitcoin",</text>
  <text x="360" y="482" text-anchor="middle" class="sig" fill="#374151">  "observedAt": "2025-05-16T12:00:00Z",</text>
  <text x="360" y="498" text-anchor="middle" class="sig" fill="#374151">  "revisionRange": { "from": 100, "to": 200 },</text>
  <text x="360" y="514" text-anchor="middle" class="sig" fill="#374151">  "merkleRoot": "a1b2c3d4e5f6...",</text>
  <text x="360" y="530" text-anchor="middle" class="sig" fill="#374151">  "eventCount": 5,</text>
  <text x="360" y="546" text-anchor="middle" class="sig" fill="#374151">  "claims": [ /* ClaimLedger entries */ ]</text>
  <text x="360" y="555" text-anchor="middle" class="sig" fill="#6b7280">}</text>
</svg>
