<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <title>Claim lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .event-label { font-size: 12px; font-weight: 700; }
    .event-desc { font-size: 10px; fill: #4b5563; }
    .timeline-label { font-size: 9px; fill: #6b7280; }
    .claim-text { font-size: 10px; font-style: italic; fill: #374151; }
    .sig { font-size: 9px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <rect width="760" height="480" fill="#fafbfc" rx="8"/>

  <text x="380" y="36" text-anchor="middle" class="title">Claim Lifecycle Across Revisions</text>
  <text x="380" y="56" text-anchor="middle" class="subtitle">How Refract tracks a single claim from first appearance through removal and reintroduction</text>

  <!-- Timeline axis -->
  <line x1="60" y1="100" x2="700" y2="100" stroke="#d1d5db" stroke-width="2"/>
  <text x="380" y="92" text-anchor="middle" class="timeline-label">TIMELINE (revision order)</text>

  <!-- Tick marks -->
  <line x1="120" y1="95" x2="120" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="120" y="120" text-anchor="middle" class="timeline-label">Rev 100</text>

  <line x1="260" y1="95" x2="260" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="120" text-anchor="middle" class="timeline-label">Rev 105</text>

  <line x1="400" y1="95" x2="400" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="400" y="120" text-anchor="middle" class="timeline-label">Rev 110</text>

  <line x1="540" y1="95" x2="540" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="540" y="120" text-anchor="middle" class="timeline-label">Rev 115</text>

  <line x1="680" y1="95" x2="680" y2="105" stroke="#6b7280" stroke-width="1"/>
  <text x="680" y="120" text-anchor="middle" class="timeline-label">Rev 130</text>

  <!-- Event 1: sentence_first_seen -->
  <line x1="120" y1="105" x2="120" y2="145" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="30" y="145" width="180" height="48" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="163" text-anchor="middle" class="event-label" fill="#065f46">sentence_first_seen</text>
  <text x="120" y="180" text-anchor="middle" class="event-desc">"Bitcoin is a digital currency..."</text>

  <!-- Event 2: citation_added -->
  <line x1="260" y1="105" x2="260" y2="205" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="170" y="205" width="180" height="48" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="223" text-anchor="middle" class="event-label" fill="#1e40af">citation_added</text>
  <text x="260" y="240" text-anchor="middle" class="event-desc">Nakamoto, 2008 whitepaper</text>

  <!-- Event 3: sentence_modified -->
  <line x1="400" y1="105" x2="400" y2="265" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="310" y="265" width="180" height="48" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="283" text-anchor="middle" class="event-label" fill="#92400e">sentence_modified</text>
  <text x="400" y="300" text-anchor="middle" class="event-desc">"...decentralized digital currency..."</text>

  <!-- Event 4: sentence_removed -->
  <line x1="540" y1="105" x2="540" y2="325" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="450" y="325" width="180" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="343" text-anchor="middle" class="event-label" fill="#991b1b">sentence_removed</text>
  <text x="540" y="360" text-anchor="middle" class="event-desc">Claim deleted from article</text>

  <!-- Event 5: sentence_reintroduced -->
  <line x1="680" y1="105" x2="680" y2="145" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="590" y="145" width="180" height="48" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="163" text-anchor="middle" class="event-label" fill="#6d28d9">sentence_reintroduced</text>
  <text x="680" y="180" text-anchor="middle" class="event-desc">Claim restored by later edit</text>

  <!-- Connection lines between events -->
  <line x1="210" y1="169" x2="170" y2="229" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="350" y1="229" x2="310" y2="289" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="490" y1="289" x2="450" y2="349" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="630" y1="349" x2="590" y2="169" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Legend -->
  <rect x="60" y="405" width="640" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="425" font-size="10" font-weight="600" fill="#374151">Claim ID:</text>
  <text x="160" y="425" class="sig">a3f5c2e1b7d409fa</text>
  <text x="90" y="442" font-size="10" font-weight="600" fill="#374151">Identity:</text>
  <text x="160" y="442" class="sig">SHA-256("Bitcoin: a digital currency...") → truncated to 16 hex chars</text>
  <text x="90" y="458" font-size="10" font-weight="600" fill="#374151">Provenance:</text>
  <text x="160" y="458" class="sig">section-differ v0.5.1 — deterministic, no model, byte-reproducible</text>
  <text x="520" y="430" font-size="10" fill="#6b7280">Every event carries this claimId.</text>
  <text x="520" y="446" font-size="10" fill="#6b7280">Chronological sort + group by claimId</text>
  <text x="520" y="462" font-size="10" fill="#6b7280">→ full claim lifecycle visible.</text>
</svg>
