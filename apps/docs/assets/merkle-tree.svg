<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">
  <title>Merkle tree integrity verification</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .box-title { font-size: 12px; font-weight: 700; }
    .hash-text { font-size: 9px; font-family: 'SF Mono', 'Fira Code', monospace; fill: #374151; }
    .step-label { font-size: 10px; font-weight: 600; fill: #6b7280; }
    .sig { font-size: 9px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <rect width="760" height="620" fill="#fafbfc" rx="8"/>

  <text x="380" y="36" text-anchor="middle" class="title">Merkle Tree Verification</text>
  <text x="380" y="56" text-anchor="middle" class="subtitle">How a replay manifest (--manifest) lets a consumer check the events it received</text>

  <!-- LEFT: Building the tree -->
  <rect x="30" y="80" width="340" height="24" rx="4" fill="#dbeafe"/>
  <text x="200" y="96" text-anchor="middle" class="step-label" fill="#1e40af">1. BUILD (producer) — refract export --manifest</text>

  <!-- Events at bottom -->
  <rect x="80" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="108" y="130" text-anchor="middle" class="hash-text">E1</text>
  <text x="108" y="144" text-anchor="middle" class="sig">h1</text>

  <rect x="156" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="184" y="130" text-anchor="middle" class="hash-text">E2</text>
  <text x="184" y="144" text-anchor="middle" class="sig">h2</text>

  <rect x="232" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="260" y="130" text-anchor="middle" class="hash-text">E3</text>
  <text x="260" y="144" text-anchor="middle" class="sig">h3</text>

  <rect x="308" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="336" y="130" text-anchor="middle" class="hash-text">E4</text>
  <text x="336" y="144" text-anchor="middle" class="sig">h4</text>

  <text x="200" y="114" text-anchor="middle" class="sig" font-weight="600">Leaves (SHA-256 of event content)</text>

  <!-- Level 1 nodes -->
  <line x1="108" y1="150" x2="146" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="184" y1="150" x2="146" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="260" y1="150" x2="336" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="336" y1="150" x2="336" y2="175" stroke="#9ca3af" stroke-width="1"/>

  <rect x="118" y="178" width="56" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="146" y="194" text-anchor="middle" class="hash-text">H(h1+h2)</text>

  <rect x="308" y="178" width="56" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="336" y="194" text-anchor="middle" class="hash-text">H(h3+h4)</text>

  <!-- Merkle Root -->
  <line x1="146" y1="202" x2="241" y2="230" stroke="#9ca3af" stroke-width="1"/>
  <line x1="336" y1="202" x2="241" y2="230" stroke="#9ca3af" stroke-width="1"/>

  <rect x="193" y="233" width="96" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="241" y="245" text-anchor="middle" class="hash-text" font-weight="700" fill="#1e40af">ROOT HASH</text>
  <text x="241" y="258" text-anchor="middle" class="sig" fill="#1e40af">a1b2c3...</text>

  <!-- RIGHT: Verifying -->
  <rect x="390" y="80" width="340" height="24" rx="4" fill="#ecfdf5"/>
  <text x="560" y="96" text-anchor="middle" class="step-label" fill="#047857">2. VERIFY (consumer) — independent re-hash</text>

  <!-- Consumer events -->
  <rect x="440" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="468" y="130" text-anchor="middle" class="hash-text">E1</text>
  <text x="468" y="144" text-anchor="middle" class="sig">h1'</text>

  <rect x="516" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="544" y="130" text-anchor="middle" class="hash-text">E2</text>
  <text x="544" y="144" text-anchor="middle" class="sig">h2'</text>

  <rect x="592" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="620" y="130" text-anchor="middle" class="hash-text">E3</text>
  <text x="620" y="144" text-anchor="middle" class="sig">h3'</text>

  <rect x="668" y="118" width="56" height="32" rx="4" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="696" y="130" text-anchor="middle" class="hash-text">E4</text>
  <text x="696" y="144" text-anchor="middle" class="sig">h4'</text>

  <line x1="468" y1="150" x2="506" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="544" y1="150" x2="506" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="620" y1="150" x2="696" y2="175" stroke="#9ca3af" stroke-width="1"/>
  <line x1="696" y1="150" x2="696" y2="175" stroke="#9ca3af" stroke-width="1"/>

  <rect x="478" y="178" width="56" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="506" y="194" text-anchor="middle" class="hash-text">H(h1'+h2')</text>

  <rect x="668" y="178" width="56" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="696" y="194" text-anchor="middle" class="hash-text">H(h3'+h4')</text>

  <line x1="506" y1="202" x2="601" y2="230" stroke="#9ca3af" stroke-width="1"/>
  <line x1="696" y1="202" x2="601" y2="230" stroke="#9ca3af" stroke-width="1"/>

  <rect x="553" y="233" width="96" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="601" y="245" text-anchor="middle" class="hash-text" font-weight="700" fill="#065f46">COMPUTED</text>
  <text x="601" y="258" text-anchor="middle" class="sig" fill="#065f46">a1b2c3...</text>

  <!-- Comparison arrow -->
  <line x1="289" y1="248" x2="549" y2="248" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="420" y="244" text-anchor="middle" class="step-label" fill="#10b981">compare →</text>

  <!-- Result -->
  <rect x="290" y="290" width="180" height="36" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="313" text-anchor="middle" class="box-title" fill="#065f46">✓ VERIFIED</text>

  <!-- How it works section -->
  <rect x="30" y="355" width="700" height="250" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="378" font-size="11" font-weight="700" fill="#374151">How it works</text>

  <text x="60" y="400" font-size="10" fill="#6b7280">1. Each event's identity fields are hashed with SHA-256, truncated to 16 hex characters → leaf hash</text>
  <text x="60" y="418" font-size="10" fill="#6b7280">2. Pairs of hashes are concatenated and re-hashed → internal nodes</text>
  <text x="60" y="436" font-size="10" fill="#6b7280">3. Internal nodes are paired and re-hashed recursively → merkleRoot</text>
  <text x="60" y="454" font-size="10" fill="#6b7280">4. The root hash is recorded in the ObservationReport or replay manifest</text>
  <text x="60" y="478" font-size="10" fill="#6b7280">5. A consumer re-hashes the events they received → computed root</text>
  <text x="60" y="496" font-size="10" fill="#6b7280">6. If computed_root == stored_root → the events match those the stored root was computed from</text>
  <text x="60" y="514" font-size="10" fill="#6b7280">7. Merkle proofs can verify a single event without the full dataset</text>

  <text x="60" y="544" font-size="10" fill="#374151" font-weight="600">Used for:</text>
  <text x="60" y="562" font-size="10" fill="#6b7280">— Verification bundles (--proof): the manifest, its events and a Merkle proof per event hash</text>
  <text x="60" y="580" font-size="10" fill="#6b7280">— Replay manifests (--manifest): lightweight integrity check without re-downloading all events</text>
  <text x="60" y="598" font-size="10" fill="#6b7280">— ObservationReport.merkleRoot (analyze --report): the same root, carried in the report</text>
</svg>
