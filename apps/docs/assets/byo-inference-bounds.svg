<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520">
  <title>Refract inference boundaries</title>
  <defs>
    <marker id="arrowMech" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowModel" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .box-title { font-size: 13px; font-weight: 700; }
    .box-desc { font-size: 10px; fill: #4b5563; }
    .boundary-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .path-label { font-size: 11px; font-weight: 600; }
    .example { font-size: 10px; fill: #6b7280; font-style: italic; }
    .sig { font-size: 9px; fill: #374151; font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>

  <rect width="760" height="520" fill="#fafbfc" rx="8"/>

  <text x="380" y="36" text-anchor="middle" class="title">BYO-Inference Boundary Flow</text>
  <text x="380" y="56" text-anchor="middle" class="subtitle">Every analyzer threshold is a typed function signature — default or model, tracked by provenance</text>

  <!-- Input -->
  <rect x="80" y="90" width="160" height="50" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="90" width="160" height="22" rx="8" fill="#e5e7eb"/>
  <text x="160" y="106" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Extracted Evidence</text>
  <text x="160" y="130" text-anchor="middle" class="sig">section_diff, wikitext, citation_refs…</text>

  <line x1="240" y1="115" x2="280" y2="115" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowMech)"/>

  <!-- Boundary decision point -->
  <rect x="290" y="82" width="180" height="66" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="290" y="82" width="180" height="26" rx="10" fill="#fef3c7"/>
  <text x="380" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Boundary: Which path?</text>
  <text x="380" y="124" text-anchor="middle" class="box-desc">Model configured?</text>
  <text x="380" y="139" text-anchor="middle" class="sig break-prose">reflect classify &lt;boundary&gt; --input '...'</text>

  <!-- Yes → Model path -->
  <line x1="420" y1="105" x2="470" y2="80" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowModel)"/>
  <text x="438" y="87" font-size="9" font-weight="600" fill="#7c3aed">yes</text>

  <!-- No → Mechanical path -->
  <line x1="470" y1="135" x2="520" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowMech)"/>
  <text x="488" y="128" font-size="9" font-weight="600" fill="#3b82f6">no</text>

  <!-- Model path box -->
  <rect x="480" y="52" width="200" height="55" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="480" y="52" width="200" height="22" rx="8" fill="#ede9fe"/>
  <text x="580" y="68" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">Model Path</text>
  <text x="580" y="88" text-anchor="middle" class="box-desc">LLM classifies boundary input</text>
  <text x="580" y="101" text-anchor="middle" class="sig">source: "model", confidence: 0.95</text>

  <!-- Mechanical path box -->
  <rect x="530" y="120" width="190" height="55" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="530" y="120" width="190" height="22" rx="8" fill="#dbeafe"/>
  <text x="625" y="136" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Mechanical Path (default)</text>
  <text x="625" y="156" text-anchor="middle" class="box-desc">Pure function — word overlap, regex, thresholds</text>
  <text x="625" y="169" text-anchor="middle" class="sig">source: "default", deterministic</text>

  <!-- Merge arrows -->
  <line x1="680" y1="80" x2="700" y2="80" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="680" y1="80" x2="680" y2="148" stroke="#7c3aed" stroke-width="1"/>
  <line x1="720" y1="148" x2="700" y2="148" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Merge point -->
  <rect x="140" y="210" width="160" height="24" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="220" y="226" text-anchor="middle" font-size="10" font-weight="600" fill="#6b7280">Result + Provenance</text>

  <line x1="530" y1="148" x2="300" y2="222" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="580" y1="107" x2="300" y2="222" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Output annotated -->
  <rect x="80" y="260" width="600" height="52" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1" filter="url(#shadow)"/>
  <text x="360" y="280" text-anchor="middle" class="sig">&lt;div hljs language-json&gt;</text>
  <text x="360" y="296" text-anchor="middle" class="sig">"source": "default" | "model",</text>
  <text x="360" y="312" text-anchor="middle" class="sig">"parameters": { "similarityThreshold": 0.85 }</text>

  <!-- === Five boundaries table === -->
  <text x="380" y="350" text-anchor="middle" class="boundary-label" fill="#374151">PLUGGABLE BOUNDARIES</text>
  <line x1="80" y1="360" x2="680" y2="360" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="30" y="378" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="114" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Sentence Similarity</text>
  <text x="114" y="414" text-anchor="middle" class="example">Default: Word overlap (0.8)</text>
  <text x="114" y="428" text-anchor="middle" class="example">Model: "Same claim?"</text>

  <rect x="210" y="378" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="294" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Revert Detection</text>
  <text x="294" y="414" text-anchor="middle" class="example">Default: 6 regex patterns</text>
  <text x="294" y="428" text-anchor="middle" class="example">Model: "Is this a revert?"</text>

  <rect x="390" y="378" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="474" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Template Classify</text>
  <text x="474" y="414" text-anchor="middle" class="example">Default: Name lookup</text>
  <text x="474" y="428" text-anchor="middle" class="example">Model: "Which policy?"</text>

  <rect x="570" y="378" width="160" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="650" y="397" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Edit Cluster</text>
  <text x="650" y="414" text-anchor="middle" class="example">Default: Time window</text>
  <text x="650" y="428" text-anchor="middle" class="example">Model: "Related?"</text>

  <rect x="570" y="398" width="160" height="40" rx="6" fill="#fff" opacity="0"/>
  <text x="650" y="414" text-anchor="middle" class="example" opacity="0">Default: Time window</text>

  <!-- Fifth boundary row -->
  <rect x="210" y="450" width="168" height="60" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="294" y="469" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Activity Spike</text>
  <text x="294" y="486" text-anchor="middle" class="example">Default: 3x moving avg</text>
  <text x="294" y="500" text-anchor="middle" class="example">Model: "Meaningful spike?"</text>

  <text x="380" y="516" text-anchor="middle" font-size="9" fill="#6b7280">Run: refract classify &lt;boundary&gt; --input '{"...":"..."}' --model gpt-4o-mini</text>
</svg>
