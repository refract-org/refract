<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refract event viewer</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#080a12" />
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <h1><svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true"><path class="brand-lens" d="M3.8 1Q8 8 3.8 15Q-.4 8 3.8 1z" /><path class="brand-ray" d="M7.6 3.8 13.8 8 7.6 12.2" /></svg>Refract</h1>
        <p class="subtitle">Event viewer for Refract JSONL exports</p>
      </header>
      <div id="toolbar">
        <div id="import-area"></div>
        <div id="filter-area"></div>
        <div id="export-area"></div>
      </div>
      <div id="dashboard">
        <div id="panel-timeline" class="panel"></div>
        <div id="dashboard-side">
          <div id="panel-diff" class="panel"></div>
          <div id="panel-citations" class="panel"></div>
          <div id="panel-certainty" class="panel"></div>
        </div>
      </div>
      <div id="dashboard-row2">
        <div id="panel-disputes" class="panel"></div>
        <div id="panel-wording" class="panel"></div>
        <div id="panel-source" class="panel"></div>
        <div id="panel-schema" class="panel"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
