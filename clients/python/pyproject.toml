[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refract-py"
version = "0.1.0"
description = "Python SDK for the Refract deterministic observation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0"
authors = [{ name = "Refract" }]
keywords = ["refract", "wikipedia", "revision-history", "evidence-graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.optional-dependencies]
dataframe = ["pandas"]
langchain = ["langchain-core"]

[tool.hatch.metadata]
allow-direct-references = true

# refract_eval and refract_langchain are top-level modules beside the package,
# and the docs import them by those names. `packages = ["src/refract"]` left
# them out of the wheel, so they worked only from a checkout.
[tool.hatch.build.targets.wheel]
only-include = ["src/refract", "src/refract_eval.py", "src/refract_langchain.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
