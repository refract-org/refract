name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install refract CLI
        run: bun add -g @refract-org/cli

      - name: install SDK and test
        run: |
          pip install -e ".[dev]"
          pip install pytest
          python -m pytest tests/ -v
