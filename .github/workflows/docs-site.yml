name: Docs site

# apps/docs, the public documentation site. Separate from the CI gate so a site
# change cannot block an engine release, and the engine gate does not wait on
# the site build.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/docs-site.yml
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/docs-site.yml

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      - run: bun run test
      - run: bun run build
