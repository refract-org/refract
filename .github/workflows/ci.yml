name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x biome ci packages/
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run test
      # What a release of this tree would put on npm: internal ranges that name
      # the versions built here, nothing depending on an unpublished package,
      # and the packed tarballs installing together and starting the CLI. The
      # registry comparison runs in publish.yml, where npm's state is the point.
      - run: bun run check:release -- --pack

# There was a `downstream` job here that checked out refract-org/refract-ui and
# ran its test suite on every pull request and push. It could not detect a
# regression in this repository, because refract-ui does not consume this one:
# its package.json declares `dependencies: {}`, nothing under its src/ imports
# an @refract-org package, and its AGENTS.md records the arrangement on purpose
# — "Types mirror @refract-org/evidence-graph schemas (defined locally in
# src/types.ts)". So the job installed a second repository and ran its single
# test against its own local types, with this PR's diff nowhere in the picture.
#
# Measured on run 34146471011: gate 14s, downstream 8s, and because downstream
# declared `needs: gate` it started only after gate finished — 29s of wall clock
# for 17s of checking.
#
# A real downstream check is still worth having, and would have to compare
# refract-ui's mirrored types against this repo's evidence-graph schemas, since
# drift between them is the actual failure mode the mirror creates. Running
# refract-ui's own suite cannot see that drift: those tests assert refract-ui
# against the very copy that drifted.
