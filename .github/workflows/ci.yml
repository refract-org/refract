name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x biome ci packages/
      - run: bun run typecheck
      - run: bun run check:boundaries
      - run: bun run test
      - run: bun run check:examples
      # What a release of this tree would put on npm: internal ranges that name
      # the versions built here, nothing depending on an unpublished package,
      # and the packed tarballs installing together and starting the CLI. The
      # registry comparison runs in publish.yml, where npm's state is the point.
      - run: bun run check:release -- --pack

# The viewer (apps/ui) and the docs site (apps/docs) have their own path-filtered
# workflows, viewer.yml and docs-site.yml, so neither can hold up this gate. The
# viewer's runs whenever evidence-graph or the captured examples change: it
# type-checks against the engine's EventType and imports the engine's output.
