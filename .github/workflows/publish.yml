name: Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # v0.5.13 and v0.5.14 died at GitHub's 6-hour default: `bun test` (Bun's
    # own runner, not the project suite) hung in CI. Fail a hang in minutes.
    # The limit has to outlast the registry readback in `Publish packages`, up
    # to 10 minutes for each of six packages: cancelled at 30, the job would stop
    # before it could report what failed or list the server in the MCP registry.
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run build
      # The project suite is vitest (`bun run test`), not `bun test` — the raw
      # Bun runner picks up every *.test.ts with a different runtime and hung
      # in CI, which is what actually killed v0.5.13/v0.5.14 (timeout, shown
      # as "cancelled").
      - run: bun run test

      # Would what this run publishes install and run for someone who gets it
      # from npm? cli 0.5.7 cannot start: it was published against analyzers and
      # ingestion source that never reached npm, because a package whose version
      # was already published was skipped below even though its source had
      # changed. The check fails on that, on an internal range that does not
      # name the sibling's version, on a dependency that is never published, and
      # on a CLI that stamps a different version than it ships as; then it packs
      # every package, installs the tarballs together with npm, and runs the
      # installed `refract --version`. See scripts/check-release.ts.
      - name: Release check
        run: bun scripts/check-release.ts --registry --pack

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Resolve npm from the Node toolchain explicitly. setup-bun puts a
          # bun-backed `npm` earlier in PATH, and bun's implementation does not
          # support OIDC token exchange — it fails with
          # "missing authentication (run `bunx npm login`)", which is what killed
          # every publish from v0.5.8 to v0.5.11.
          NPM="$(dirname "$(which node)")/npm"

          # Trusted publishing (OIDC, no stored token) needs npm 11.5.1 or later;
          # Node 22 bundles npm 10, which has no OIDC login and fails ENEEDAUTH
          # when NPM_TOKEN is unset. That is how v0.5.15 died (run 33039984437).
          # A token in NPM_TOKEN keeps working either way.
          "$NPM" install -g npm@^11.5.1
          "$NPM" --version

          # npm accepting a publish does not mean an install can see the version.
          # v0.6.0 (run 41903225637) published evidence-graph, ingestion and analyzers
          # at 20:05:59, 20:06:04 and 20:06:08 on this job's clock, and the registry
          # dated them 20:08:05, 20:07:19 and 20:08:45: minutes later, out of order.
          # ingestion 0.3.4 was visible while the evidence-graph 0.5.3 it needs was
          # not, and the published CLI's range picks up the newest ingestion, so a
          # clean `npm install @refract-org/cli` failed with ETARGET until the
          # registry caught up. Dependency order only protects an install if each
          # package is readable before the next one goes out.
          #
          # Read the packument, because ranges resolve against it and `npm view` of
          # an exact version can answer first. The registry caches two forms of it
          # separately, and both have to show the version: npm's resolver asks for
          # the full document, and bun for the abbreviated one. Do not bust that
          # cache, because installs go through it. It keeps a packument for up to 5
          # minutes (max-age=300), which is why the limit is twice that.
          REGISTRY_WAIT_SECONDS=600
          REGISTRY_POLL_SECONDS=10
          registry_serves() {
            local accept
            for accept in \
              "application/json" \
              "application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*"; do
              curl --fail --silent --show-error --max-time 30 --header "Accept: $accept" \
                "https://registry.npmjs.org/${1/\//%2F}" \
                | node -e 'try { process.exit(JSON.parse(require("fs").readFileSync(0)).versions[process.argv[1]] ? 0 : 1) } catch { process.exit(1) }' "$2" \
                || return 1
            done
          }
          wait_for_registry() {
            local started=$SECONDS
            until registry_serves "$1" "$2"; do
              if [ $((SECONDS - started)) -ge "$REGISTRY_WAIT_SECONDS" ]; then
                return 1
              fi
              echo "$1@$2 not readable after $((SECONDS - started))s"
              sleep "$REGISTRY_POLL_SECONDS"
            done
            echo "$1@$2 readable after $((SECONDS - started))s"
          }

          # Dependency order, from the same script that checked it. The list was
          # hand-written and left out @refract-org/mcp, which the CLI imports at
          # startup, so the next CLI would not have installed at all.
          FAILED=""
          FAILED_NAMES=""
          for pkg in $(bun scripts/check-release.ts --order); do
            echo "::group::Publishing $pkg"
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            # A package whose internal dependency just failed would install for
            # nobody, and once it is `latest` that breaks every new install. Hold
            # it back, so a partial release leaves the previous version working.
            BLOCKED=""
            for dep in $(node -p "Object.keys(require('./$pkg/package.json').dependencies ?? {}).join(' ')"); do
              case " $FAILED_NAMES " in *" $dep "*) BLOCKED="$dep" ;; esac
            done
            if [ -n "$BLOCKED" ]; then
              echo "::error::Not publishing $NAME@$VERSION: its dependency $BLOCKED failed"
              FAILED="$FAILED $NAME@$VERSION"
              FAILED_NAMES="$FAILED_NAMES $NAME"
              echo "::endgroup::"
              continue
            fi
            # Skip versions already on the registry: packages version
            # independently, so most tags republish only some of them, and npm
            # rejects a duplicate PUT — which failed the whole run. Skipping is
            # safe only because the release check has already shown that an
            # existing version carries this tree's source.
            if "$NPM" view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published — skipping"
            else
              # A failed publish still fails the run — v0.5.12 reported success
              # while every package 404'd on PUT (npm's response to an
              # unauthorized write), so the tag looked released and was not.
              # But it must not stop unrelated packages after it: v0.5.16 died at
              # @refract-org/mcp (a new package, which cannot use trusted
              # publishing until it exists on npm) and left eval behind it.
              # Attempt each package whose dependencies made it, then fail once.
              if ( cd "$pkg" && "$NPM" publish --access public --provenance ); then
                echo "$NAME@$VERSION published"
                # The version exists now and cannot be taken back, but its dependents
                # would install for nobody yet. Failing here holds them back, and a
                # re-run finds this version already published and carries on.
                if ! wait_for_registry "$NAME" "$VERSION"; then
                  echo "::error::$NAME@$VERSION was published, but the registry did not serve it within $REGISTRY_WAIT_SECONDS seconds"
                  FAILED="$FAILED $NAME@$VERSION"
                  FAILED_NAMES="$FAILED_NAMES $NAME"
                fi
              else
                echo "::error::Publish failed for $NAME@$VERSION"
                FAILED="$FAILED $NAME@$VERSION"
                FAILED_NAMES="$FAILED_NAMES $NAME"
              fi
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "Publish failed for:$FAILED"
            exit 1
          fi

      # The registry reads mcpName from the npm package to confirm ownership of
      # the name in server.json, so this has to follow the npm publish above.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          # npm can take a moment to serve a version it has just accepted.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
          exit 1
