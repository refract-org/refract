name: Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # v0.5.13 and v0.5.14 died at GitHub's 6-hour default: `bun test` (Bun's
    # own runner, not the project suite) hung in CI. Fail a hang in minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run build
      # The project suite is vitest (`bun run test`), not `bun test` — the raw
      # Bun runner picks up every *.test.ts with a different runtime and hung
      # in CI, which is what actually killed v0.5.13/v0.5.14 (timeout, shown
      # as "cancelled").
      - run: bun run test

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Resolve npm from the Node toolchain explicitly. setup-bun puts a
          # bun-backed `npm` earlier in PATH, and bun's implementation does not
          # support OIDC token exchange — it fails with
          # "missing authentication (run `bunx npm login`)", which is what killed
          # every publish from v0.5.8 to v0.5.11.
          NPM="$(dirname "$(which node)")/npm"
          "$NPM" --version

          for pkg in packages/evidence-graph packages/ingestion packages/analyzers packages/cli packages/eval; do
            echo "::group::Publishing $pkg"
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            # Skip versions already on the registry: packages version
            # independently, so most tags republish only some of them, and npm
            # rejects a duplicate PUT — which failed the whole run.
            if "$NPM" view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published — skipping"
            else
              # No `|| true`. A failed publish must fail the run: v0.5.12 reported
              # success while every package 404'd on PUT (npm's response to an
              # unauthorized write), so the tag looked released and was not.
              ( cd "$pkg" && "$NPM" publish --access public --provenance )
            fi
            echo "::endgroup::"
          done
