name: Deploy docs site

# Publishes apps/docs to this repository's GitHub Pages site,
# https://refract-org.github.io/refract/. The site used to deploy from the
# refract-docs repository at /refract-docs/; that address now serves a
# redirect-only site pointing each old page at its new one.
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
